<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qrmeunu · Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #E8532E;
            --primary-light: #FFF5F2;
            --secondary: #1A8A7D;
            --secondary-light: #E0F5F2;
            --dark: #111827;
            --bg: #F3F4F6;
            --white: #FFFFFF;
            --text: #111827;
            --text-muted: #6B7280;
            --text-light: #9CA3AF;
            --border: #E5E7EB;
            --whatsapp: #25D366;
            --danger: #EF4444;
            --danger-light: #FEF2F2;
            --warning: #F59E0B;
            --warning-light: #FFFBEB;
            --success: #10B981;
            --success-light: #ECFDF5;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.07);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            font-size: 15px;
            color: var(--text);
            background: var(--bg);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        /* ── TOP BAR ── */
        .topbar {
            background: var(--white);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .topbar-left img { height: 36px; border-radius: 8px; }
        .topbar-left h1 { font-size: 18px; font-weight: 700; color: var(--text); }
        .topbar-left h1 span { color: var(--text-light); font-weight: 400; font-size: 14px; margin-left: 8px; }
        .topbar-right { display: flex; align-items: center; gap: 10px; }
        #db-status {
            font-size: 12px; font-weight: 600; padding: 5px 12px;
            border-radius: 999px; white-space: nowrap;
            background: #EFF6FF; color: #3B82F6;
        }
        .topbar-date { font-size: 13px; color: var(--text-muted); display: none; }
        @media(min-width:640px) { .topbar-date { display: block; } }

        .page { max-width: 1200px; margin: 0 auto; padding: 20px; }

        /* ── ALERT ── */
        .alert {
            display: none;
            padding: 14px 18px;
            border-radius: var(--radius);
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .alert-warning { background: var(--warning-light); color: #92400E; border: 1px solid #FDE68A; }
        .alert a { color: inherit; font-weight: 700; text-decoration: underline; }

        /* ── STAT CARDS ── */
        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        @media(min-width:640px) { .stats { grid-template-columns: repeat(5, 1fr); } }
        .stat {
            background: var(--white);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .stat-label { font-size: 12px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-value { font-size: 28px; font-weight: 800; color: var(--text); margin-top: 4px; }
        .stat-value.primary { color: var(--primary); }

        /* ── TOOLBAR ── */
        .toolbar {
            background: var(--white);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: flex-end;
        }
        .toolbar-field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 140px; }
        .toolbar-field label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .toolbar-field input, .toolbar-field select {
            height: 38px; padding: 0 10px; border: 1px solid var(--border);
            border-radius: var(--radius-sm); font-size: 14px; font-family: inherit;
            background: var(--bg); color: var(--text);
        }
        .toolbar-field input:focus, .toolbar-field select:focus {
            outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(232,83,46,0.15);
        }
        .toolbar-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-sm {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 14px; border-radius: var(--radius-sm);
            font-size: 13px; font-weight: 600; font-family: inherit;
            border: none; cursor: pointer; transition: all 0.15s; white-space: nowrap;
        }
        .btn-sm:active { transform: scale(0.97); }
        .btn-teal { background: var(--secondary-light); color: var(--secondary); }
        .btn-teal:hover { background: #C6F0EA; }
        .btn-orange { background: var(--primary-light); color: var(--primary); }
        .btn-orange:hover { background: #FFE8E0; }

        /* ── TABLE ── */
        .table-wrap {
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        table { width: 100%; border-collapse: collapse; }
        thead th {
            background: var(--bg); font-size: 11px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.5px;
            color: var(--text-muted); padding: 12px 14px; text-align: left;
            border-bottom: 1px solid var(--border); white-space: nowrap;
        }
        tbody td {
            padding: 14px; border-bottom: 1px solid var(--border);
            font-size: 14px; vertical-align: middle;
        }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover { background: #F9FAFB; }

        .cell-name { font-weight: 600; color: var(--text); }
        .cell-restaurant { color: var(--text-muted); font-size: 13px; }
        .cell-phone a {
            color: var(--secondary); font-weight: 600; text-decoration: none;
        }
        .cell-email { color: var(--text-muted); font-size: 13px; }

        .pill {
            display: inline-flex; align-items: center; padding: 3px 10px;
            border-radius: 999px; font-size: 12px; font-weight: 600;
        }
        .pill-basic { background: #F3F4F6; color: #374151; }
        .pill-commande { background: var(--primary-light); color: var(--primary); }
        .pill-caisse { background: var(--secondary-light); color: var(--secondary); }

        .status-select {
            padding: 5px 8px; border-radius: 6px; font-size: 13px; font-family: inherit;
            border: 1px solid var(--border); cursor: pointer; background: var(--white);
        }
        .status-select:focus { outline: none; border-color: var(--primary); }

        .actions { display: flex; gap: 6px; }
        .act-btn {
            padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: 600;
            border: none; cursor: pointer; font-family: inherit; transition: all 0.15s;
        }
        .act-btn:active { transform: scale(0.95); }
        .act-wa { background: #DCFCE7; color: #166534; }
        .act-wa:hover { background: #BBF7D0; }
        .act-del { background: var(--danger-light); color: var(--danger); }
        .act-del:hover { background: #FEE2E2; }

        .empty-state {
            text-align: center; padding: 48px 20px; color: var(--text-muted);
        }
        .empty-state .icon { font-size: 40px; margin-bottom: 12px; display: block; }
        .empty-state h3 { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 6px; }

        /* ── MOBILE TABLE → CARDS ── */
        @media(max-width: 768px) {
            table, thead, tbody, th, td, tr { display: block; }
            thead { display: none; }
            tbody tr {
                padding: 16px; margin-bottom: 8px; position: relative;
                border-bottom: 1px solid var(--border);
            }
            tbody tr:hover { background: var(--white); }
            td {
                display: flex; justify-content: space-between; align-items: center;
                padding: 5px 0; border: none; font-size: 14px;
            }
            td::before {
                content: attr(data-label);
                font-weight: 600; font-size: 12px; color: var(--text-muted);
                text-transform: uppercase; letter-spacing: 0.3px;
                min-width: 100px;
            }
            .actions { justify-content: flex-end; padding-top: 8px; }
        }
    </style>
</head>
<body>

<div class="topbar">
    <div class="topbar-left">
        <img src="assets/brand_image_6.png" alt="Qrmeunu">
        <h1>Admin <span id="current-date"></span></h1>
    </div>
    <div class="topbar-right">
        <span id="db-status">⚡ Connexion...</span>
    </div>
</div>

<div class="page">
    <div id="firestore-notice" class="alert alert-warning"></div>

    <div class="stats">
        <div class="stat">
            <div class="stat-label">Total</div>
            <div class="stat-value primary" id="stat-total">0</div>
        </div>
        <div class="stat">
            <div class="stat-label">Aujourd'hui</div>
            <div class="stat-value" id="stat-today">0</div>
        </div>
        <div class="stat">
            <div class="stat-label">Basic</div>
            <div class="stat-value" id="stat-basic">0</div>
        </div>
        <div class="stat">
            <div class="stat-label">Commande</div>
            <div class="stat-value" id="stat-commande">0</div>
        </div>
        <div class="stat">
            <div class="stat-label">Caisse Pro</div>
            <div class="stat-value" id="stat-caisse">0</div>
        </div>
    </div>

    <div class="toolbar">
        <div class="toolbar-field" style="flex:2;">
            <label>Recherche</label>
            <input type="text" id="search" placeholder="Nom ou restaurant...">
        </div>
        <div class="toolbar-field">
            <label>Wilaya</label>
            <select id="filter-wilaya">
                <option value="">Toutes</option>
                <option value="1-Adrar">Adrar</option><option value="2-Chlef">Chlef</option><option value="3-Laghouat">Laghouat</option>
                <option value="4-Oum El Bouaghi">Oum El Bouaghi</option><option value="5-Batna">Batna</option><option value="6-Bejaia">Béjaïa</option>
                <option value="7-Biskra">Biskra</option><option value="8-Bechar">Béchar</option><option value="9-Blida">Blida</option>
                <option value="10-Bouira">Bouira</option><option value="11-Tamanrasset">Tamanrasset</option><option value="12-Tebessa">Tébessa</option>
                <option value="13-Tlemcen">Tlemcen</option><option value="14-Tiaret">Tiaret</option><option value="15-Tizi Ouzou">Tizi Ouzou</option>
                <option value="16-Alger">Alger</option><option value="17-Djelfa">Djelfa</option><option value="18-Jijel">Jijel</option>
                <option value="19-Setif">Sétif</option><option value="20-Saida">Saïda</option><option value="21-Skikda">Skikda</option>
                <option value="22-Sidi Bel Abbes">Sidi Bel Abbès</option><option value="23-Annaba">Annaba</option><option value="24-Guelma">Guelma</option>
                <option value="25-Constantine">Constantine</option><option value="26-Medea">Médéa</option><option value="27-Mostaganem">Mostaganem</option>
                <option value="28-MSila">M'Sila</option><option value="29-Mascara">Mascara</option><option value="30-Ouargla">Ouargla</option>
                <option value="31-Oran">Oran</option><option value="32-El Bayadh">El Bayadh</option><option value="33-Illizi">Illizi</option>
                <option value="34-Bordj Bou Arreridj">Bordj Bou Arreridj</option><option value="35-Boumerdes">Boumerdès</option>
                <option value="36-El Tarf">El Tarf</option><option value="37-Tindouf">Tindouf</option><option value="38-Tissemsilt">Tissemsilt</option>
                <option value="39-El Oued">El Oued</option><option value="40-Khenchela">Khenchela</option><option value="41-Souk Ahras">Souk Ahras</option>
                <option value="42-Tipaza">Tipaza</option><option value="43-Mila">Mila</option><option value="44-Ain Defla">Aïn Defla</option>
                <option value="45-Naama">Naâma</option><option value="46-Ain Temouchent">Aïn Témouchent</option><option value="47-Ghardaia">Ghardaïa</option>
                <option value="48-Relizane">Relizane</option><option value="49-Timimoun">Timimoun</option>
                <option value="50-Bordj Badji Mokhtar">Bordj Badji Mokhtar</option><option value="51-Ouled Djellal">Ouled Djellal</option>
                <option value="52-Beni Abbes">Béni Abbès</option><option value="53-In Salah">In Salah</option>
                <option value="54-In Guezzam">In Guezzam</option><option value="55-Touggourt">Touggourt</option>
                <option value="56-Djanet">Djanet</option><option value="57-El MGhair">El M'Ghair</option><option value="58-El Meniaa">El Meniaa</option>
            </select>
        </div>
        <div class="toolbar-field">
            <label>Formule</label>
            <select id="filter-formule">
                <option value="">Toutes</option>
                <option value="Basic">Basic</option>
                <option value="Commande">Commande</option>
                <option value="Caisse Pro">Caisse Pro</option>
            </select>
        </div>
        <div class="toolbar-field">
            <label>Du</label>
            <input type="date" id="date-from">
        </div>
        <div class="toolbar-field">
            <label>Au</label>
            <input type="date" id="date-to">
        </div>
        <div class="toolbar-actions">
            <button class="btn-sm btn-teal" onclick="window.exportCSV()">📥 CSV</button>
            <button class="btn-sm btn-orange" onclick="window.generateSampleData()">🧪 Test Data</button>
        </div>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Client</th>
                    <th>Téléphone</th>
                    <th>Wilaya</th>
                    <th>Formule</th>
                    <th>Statut</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="orders-table-body"></tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const app = initializeApp({
        apiKey: "AIzaSyBUDfe0o3J03Ax-6tQIFrXau3Ds0c4H234",
        authDomain: "restau-dfbb2.firebaseapp.com",
        projectId: "restau-dfbb2",
        storageBucket: "restau-dfbb2.firebasestorage.app",
        messagingSenderId: "1018720003065",
        appId: "1:1018720003065:web:9713c7633cfff1b4131328"
    });
    const db = getFirestore(app);
    const KEY = 'qrmeunu_leads';
    let allOrders = [];
    let live = false;

    document.getElementById('current-date').textContent = new Date().toLocaleDateString('fr-FR', { weekday:'short', day:'numeric', month:'short', year:'numeric' });

    const badge = document.getElementById('db-status');
    const notice = document.getElementById('firestore-notice');

    function local(k) { try { return JSON.parse(localStorage.getItem(k)||'[]'); } catch(e) { return []; } }
    function save(d) { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch(e){} }

    // Firestore realtime
    try {
        onSnapshot(collection(db, "leads"), snap => {
            live = true;
            badge.textContent = "🟢 En direct";
            badge.style.background = "#DCFCE7"; badge.style.color = "#166534";
            notice.style.display = 'none';
            const arr = [];
            snap.forEach(d => {
                const data = d.data();
                let dt = data.date || new Date().toISOString();
                if (data.createdAt?.toDate) dt = data.createdAt.toDate().toISOString();
                arr.push({ id: d.id, ...data, date: dt });
            });
            allOrders = arr; save(arr); window.renderTable();
        }, err => {
            live = false;
            badge.textContent = "🟠 Mode local";
            badge.style.background = "#FFFBEB"; badge.style.color = "#92400E";
            if (err.code === 'permission-denied') {
                notice.style.display = 'block';
                notice.innerHTML = `⚠️ Accès Firestore refusé. <a href="https://console.firebase.google.com/project/restau-dfbb2/firestore/rules" target="_blank">Configurer les règles →</a>`;
            }
            allOrders = local(KEY); window.renderTable();
        });
    } catch(e) { allOrders = local(KEY); window.renderTable(); }

    function pillClass(f) {
        if (f === 'Commande') return 'pill-commande';
        if (f === 'Caisse Pro') return 'pill-caisse';
        return 'pill-basic';
    }

    window.updateStatus = async (id, s) => {
        try { await updateDoc(doc(db, "leads", id), { status: s }); } catch(e) {}
        const i = allOrders.findIndex(o => o.id === id);
        if (i > -1) { allOrders[i].status = s; save(allOrders); window.renderTable(); }
    };
    window.deleteOrder = async (id) => {
        if (!confirm('Supprimer cette demande ?')) return;
        try { await deleteDoc(doc(db, "leads", id)); } catch(e) {}
        allOrders = allOrders.filter(o => o.id !== id); save(allOrders); window.renderTable();
    };
    window.openWhatsApp = (p) => { window.open(`https://wa.me/${(p||'').replace(/\D/g,'')}`, '_blank'); };

    window.exportCSV = () => {
        const h = ['Date','Nom','Restaurant','Téléphone','Email','Wilaya','Formule','Statut'];
        const csv = "data:text/csv;charset=utf-8," + h.join(",") + "\n" +
            allOrders.map(o => [
                new Date(o.date).toLocaleString(),
                `"${o.name||''}"`,`"${o.restaurant||''}"`,`"${o.phone||''}"`,
                `"${o.email||''}"`,`"${o.wilaya||''}"`,`"${o.formule||''}"`,`"${o.status||('')}"`
            ].join(",")).join("\n");
        const a = document.createElement("a");
        a.href = encodeURI(csv); a.download = "qrmeunu_leads.csv";
        document.body.appendChild(a); a.click(); a.remove();
    };

    window.generateSampleData = async () => {
        const names = [
            { name:"Ahmed Benali", restaurant:"Le Petit Creux", phone:"0555123456", wilaya:"16-Alger", formule:"Basic" },
            { name:"Sara Mansouri", restaurant:"Pizza Fast", phone:"0770987654", wilaya:"31-Oran", formule:"Commande" },
            { name:"Karim Louahab", restaurant:"Burger House", phone:"0661223344", wilaya:"25-Constantine", formule:"Caisse Pro" },
            { name:"Yasmine Bouzid", restaurant:"Café Zen", phone:"0550112233", wilaya:"16-Alger", formule:"Commande" },
            { name:"Nadir Fares", restaurant:"Tacos DZ", phone:"0771445566", wilaya:"31-Oran", formule:"Basic" }
        ];
        for (const s of names) {
            const d = { ...s, email: "", date: new Date().toISOString(), status: "Nouveau" };
            try { const ref = await addDoc(collection(db, "leads"), { ...d, createdAt: serverTimestamp() }); d.id = ref.id; }
            catch(e) { d.id = "local_" + Date.now() + Math.random().toString(36).slice(2,6); }
            allOrders.unshift(d);
        }
        save(allOrders); window.renderTable();
    };

    window.renderTable = () => {
        let orders = [...allOrders].sort((a,b) => new Date(b.date||0) - new Date(a.date||0));

        const search = (document.getElementById('search').value||'').toLowerCase();
        const fW = document.getElementById('filter-wilaya').value;
        const fF = document.getElementById('filter-formule').value;
        const dFrom = document.getElementById('date-from').value;
        const dTo = document.getElementById('date-to').value;

        orders = orders.filter(o => {
            const n = (o.name||'').toLowerCase(), r = (o.restaurant||'').toLowerCase();
            if (search && !n.includes(search) && !r.includes(search)) return false;
            if (fW && o.wilaya !== fW) return false;
            if (fF && o.formule !== fF) return false;
            if (dFrom) { const d = new Date(o.date); d.setHours(0,0,0,0); if (d < new Date(dFrom)) return false; }
            if (dTo) { const dt = new Date(dTo); dt.setHours(23,59,59,999); if (new Date(o.date) > dt) return false; }
            return true;
        });

        document.getElementById('stat-total').textContent = orders.length;
        const today = new Date(); today.setHours(0,0,0,0);
        document.getElementById('stat-today').textContent = orders.filter(o => new Date(o.date) >= today).length;
        document.getElementById('stat-basic').textContent = orders.filter(o => o.formule === 'Basic').length;
        document.getElementById('stat-commande').textContent = orders.filter(o => o.formule === 'Commande').length;
        document.getElementById('stat-caisse').textContent = orders.filter(o => o.formule === 'Caisse Pro').length;

        const tbody = document.getElementById('orders-table-body');

        if (!orders.length) {
            tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state"><span class="icon">📋</span><h3>Aucune demande</h3><p>Cliquez sur "🧪 Test Data" pour générer des exemples.</p></div></td></tr>`;
            return;
        }

        tbody.innerHTML = orders.map(o => {
            const d = new Date(o.date);
            const dateStr = d.toLocaleDateString('fr-FR', {day:'2-digit',month:'short'}) + ' ' + d.toLocaleTimeString('fr-FR', {hour:'2-digit',minute:'2-digit'});
            const sts = ['Nouveau','Contacté','Confirmé'].map(s => `<option value="${s}" ${o.status===s?'selected':''}>${s}</option>`).join('');
            return `<tr>
                <td data-label="Date"><span style="font-size:13px;color:var(--text-muted);">${dateStr}</span></td>
                <td data-label="Client"><div class="cell-name">${o.name||'-'}</div><div class="cell-restaurant">${o.restaurant||''}</div>${o.email ? `<div class="cell-email">${o.email}</div>` : ''}</td>
                <td data-label="Tél" class="cell-phone"><a href="tel:${o.phone||''}">${o.phone||'-'}</a></td>
                <td data-label="Wilaya"><span style="font-size:13px;">${o.wilaya||'-'}</span></td>
                <td data-label="Formule"><span class="pill ${pillClass(o.formule||'')}">${o.formule||'-'}</span></td>
                <td data-label="Statut"><select class="status-select" onchange="window.updateStatus('${o.id}',this.value)">${sts}</select></td>
                <td data-label="Actions"><div class="actions"><button class="act-btn act-wa" onclick="window.openWhatsApp('${o.phone||''}')">💬</button><button class="act-btn act-del" onclick="window.deleteOrder('${o.id}')">🗑</button></div></td>
            </tr>`;
        }).join('');
    };

    ['search','filter-wilaya','filter-formule','date-from','date-to'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('input', window.renderTable);
    });
    window.addEventListener('focus', () => { if (!live) { allOrders = local(KEY); window.renderTable(); } });
    allOrders = local(KEY); window.renderTable();
</script>
